<form method="POST" action="{% url 'update_supplier' supplier.supplier_id %}" class="space-y-4">
    {% csrf_token %}
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-black-700 mb-2">Supplier Name *</label>
            <input type="text" name="name" value="{{ supplier.name }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-black-700 mb-2">Contact Person</label>
            <input type="text" name="contact_person" value="{{ supplier.contact_person|default:'' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400"
                   placeholder="Full name">
        </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-black-700 mb-2">Email Address</label>
            <input type="email" name="email" value="{{ supplier.email|default:'' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400"
                   placeholder="contact@company.com">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-black-700 mb-2">Phone Number *</label>
            <input type="text" name="phone" value="{{ supplier.phone }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400"
                   placeholder="+63 XXX XXX XXXX">
        </div>
    </div>
    
    <div>
        <label class="block text-sm font-medium text-black-700 mb-2">Address</label>
        <textarea name="address" rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400"
                  placeholder="Full business address">{{ supplier.address|default:'' }}</textarea>
    </div>
    
    <div>
        <label class="block text-sm font-medium text-black-700 mb-2">Payment Terms</label>
        <input type="text" name="payment_terms" value="{{ supplier.payment_terms }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-400"
               placeholder="e.g., Net 30, 2% 10 Net 30">
    </div>
    
    <div class="flex justify-between items-center pt-4 border-t">
        <button type="button" 
                onclick="closeEditSupplierModal()"
                class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
            Cancel
        </button>
        
        <div class="flex space-x-3">
            {% if current_admin.role == 'super_admin' %}
            <button type="button"
                    onclick="confirmDeleteSupplier('{{ supplier.supplier_id }}')"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                <i class="fas fa-trash mr-1"></i> Delete
            </button>
            {% endif %}
            
            <button type="submit" 
                    class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </div>
</form>

<script>
function confirmDeleteSupplier(supplierId) {
    if (confirm('Are you sure you want to delete this supplier? This action cannot be undone.')) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `/delete-supplier/${supplierId}/`;
        
        const csrf = document.createElement('input');
        csrf.type = 'hidden';
        csrf.name = 'csrfmiddlewaretoken';
        csrf.value = '{{ csrf_token }}';
        form.appendChild(csrf);
        
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
